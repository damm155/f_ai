name: CI

# push 到 main/fix 分支或 PR 时触发：跑回归与单元测试，并构建 universal release。
# 有仓库签名 Secrets 时产出签名 APK；没有时产出 unsigned APK。打 v* tag 仍走 android-release.yml。
on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/**' ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 由 build.gradle.kts 的 gitCommitCount() 在配置阶段取
          # git rev-list --count HEAD，浅克隆（默认 depth=1）会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR 用只读缓存，仅 main 的 push 写回缓存，避免被 PR 污染。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up reverse tool test dependencies
        run: |
          python3 -m pip install capstone==5.0.7 pyelftools==0.32
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Run reverse tool regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -v

      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 main 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 单元测试（app/src/test 下的 Kotlin 单测）。
      # 只跑 universal debug 变体：单测逻辑与 flavor 无关（flavor 仅影响 abiFilters/assets），
      # 跑全 flavor 6 变体是重复编译，无额外覆盖。
      - name: Run unit tests
        run: ./gradlew :app:testUniversalDebugUnitTest --stacktrace

      - name: Configure release signing when secrets are available
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/aicode.jks
            {
              printf 'storeFile=aicode.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > app/keystore.properties
            echo 'Release signing enabled.'
          else
            echo 'Release signing secrets unavailable; the release APK will be unsigned.'
          fi

      - name: Build universal release
        run: ./gradlew :app:assembleUniversalRelease --stacktrace

      - name: Validate release APK
        run: |
          apk="$(find app/build/outputs/apk/universal/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -t "$apk"
          echo "release_apk=$apk" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: reverse-tools-release-${{ github.sha }}
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

      - name: Clean release signing material
        if: always()
        run: rm -f app/aicode.jks app/keystore.properties

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-tools-tests-${{ github.sha }}
          path: |
            app/build/reports/tests/testUniversalDebugUnitTest/
            app/build/test-results/testUniversalDebugUnitTest/
          if-no-files-found: ignore
