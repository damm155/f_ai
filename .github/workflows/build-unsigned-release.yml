name: Build Unsigned Release APK

# 无需签名 Secrets 的打包通道：构建 universal release（arm64-v8a）并上传 APK 产物。
# 仓库未配置 keystore 时 AGP 输出 unsigned 包（app-universal-release-unsigned.apk），
# 需自行用 apksigner 签名后安装。需要正式签名包的走 android-release.yml（依赖 keystore Secrets）。
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode 取 git rev-list --count HEAD，浅克隆会得到 1，必须拉完整历史。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build universal release APK
        run: ./gradlew :app:assembleUniversalRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aicode-universal-release-unsigned
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
